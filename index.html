<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - Justiça Eleitoral</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Principal da Urna */
        .urna-container {
            background-color: #e2e2e2;
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            gap: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 950px;
            width: 100%;
        }

        /* Tela da Urna */
        .tela {
            background-color: #ffffff;
            border: 2px solid #000;
            width: 520px;
            height: 380px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        /* Topo da Tela */
        .tela-topo {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
        }

        .logo-tse {
            height: 45px;
            object-fit: contain;
        }

        .titulo-eleicao {
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }

        /* Corpo da Votação */
        .voto-corpo {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-top: 15px;
        }

        .cargo-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cargo-nome {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .caixas-digitos {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .digito-box {
            width: 35px;
            height: 45px;
            border: 2px solid #000;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .digito-box.pisca {
            animation: piscar 1s infinite;
        }

        @keyframes piscar {
            0% { border-color: #000; }
            50% { border-color: transparent; }
            100% { border-color: #000; }
        }

        .dados-candidato {
            margin-top: 10px;
            font-size: 15px;
            line-height: 1.4;
        }

        .foto-candidato {
            position: absolute;
            right: 15px;
            top: 70px;
            width: 120px;
            height: 150px;
            border: 1px solid #000;
            object-fit: cover;
            background-color: #eee;
            display: none;
        }

        /* Rodapé de Instrução */
        .instrucoes {
            border-top: 1px solid #000;
            padding-top: 8px;
            font-size: 11px;
            line-height: 1.3;
        }

        /* Tela Final (FIM) */
        .tela-fim {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
            position: relative;
            background: #fff;
        }

        .fim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }

        .fim-texto {
            font-size: 90px;
            font-weight: bold;
            text-align: center;
            margin: auto;
            letter-spacing: 5px;
        }

        .fim-footer {
            text-align: right;
            font-size: 20px;
            color: #777;
            font-weight: bold;
        }

        /* Teclado da Urna */
        .teclado {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 300px;
        }

        .teclado-numerico {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            justify-items: center;
        }

        .btn-num {
            background: #111;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            width: 55px;
            height: 45px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 3px #000;
        }

        .btn-num:active {
            transform: translateY(2px);
            box-shadow: 0 1px #000;
        }

        .teclado-acoes {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-acao {
            flex: 1;
            height: 45px;
            border: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-branco { background-color: #ffffff; color: #000; }
        .btn-corrige { background-color: #e65100; color: #fff; }
        .btn-confirma { background-color: #2fe438; color: #fff; height: 52px; }

        /* Painel Admin Modals */
        .admin-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }

        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="urna-container">
        <!-- TELA DA URNA -->
        <div class="tela" id="tela">
            <div id="tela-votacao" style="height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
                <div class="tela-topo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Logo_TSE.png" alt="Logo TSE" class="logo-tse">
                    <div class="titulo-eleicao">JUSTIÇA ELEITORAL</div>
                </div>

                <div class="voto-corpo">
                    <div class="cargo-label">SEU VOTO VAI PARA</div>
                    <div class="cargo-nome" id="cargo-nome">GOVERNADOR</div>

                    <div class="caixas-digitos" id="caixas-digitos"></div>

                    <div class="dados-candidato" id="dados-candidato"></div>
                    <img src="" alt="Candidato" class="foto-candidato" id="foto-candidato">
                </div>

                <div class="instrucoes">
                    Aperte a tecla:<br>
                    <strong>CONFIRMA</strong> para CONFIRMAR este voto<br>
                    <strong>CORRIGE</strong> para REINICIAR este voto
                </div>
            </div>

            <!-- TELA DE FIM -->
            <div class="tela-fim" id="tela-fim">
                <div class="fim-header">
                    <span id="fim-data-hora"></span>
                    <span>TREINAMENTO</span>
                    <span>🔋</span>
                </div>
                <div class="fim-texto">FIM</div>
                <div class="fim-footer">VOTOU</div>
            </div>
        </div>

        <!-- TECLADO -->
        <div class="teclado">
            <div class="teclado-numerico">
                <button class="btn-num" onclick="digitar('1')">1</button>
                <button class="btn-num" onclick="digitar('2')">2</button>
                <button class="btn-num" onclick="digitar('3')">3</button>
                <button class="btn-num" onclick="digitar('4')">4</button>
                <button class="btn-num" onclick="digitar('5')">5</button>
                <button class="btn-num" onclick="digitar('6')">6</button>
                <button class="btn-num" onclick="digitar('7')">7</button>
                <button class="btn-num" onclick="digitar('8')">8</button>
                <button class="btn-num" onclick="digitar('9')">9</button>
                <button class="btn-num" style="grid-column: 2" onclick="digitar('0')">0</button>
            </div>
            <div class="teclado-acoes">
                <button class="btn-acao btn-branco" onclick="votarBranco()">BRANCO</button>
                <button class="btn-acao btn-corrige" onclick="corrige()">CORRIGE</button>
                <button class="btn-acao btn-confirma" onclick="confirma()">CONFIRMA</button>
            </div>
        </div>
    </div>

    <button class="admin-btn" onclick="abrirAdmin()">Painel Administrador</button>

    <!-- Modal Admin -->
    <div class="modal" id="modal-admin">
        <div class="modal-content">
            <h3>Painel de Administração</h3>
            <p>Informe a senha para acessar:</p>
            <input type="password" id="senha-admin" placeholder="Senha">
            <button onclick="autenticarAdmin()">Acessar</button>
            <button onclick="fecharAdmin()">Cancelar</button>
            <div id="admin-conteudo" style="display:none; margin-top:15px;">
                <h4>Apuração dos Votos</h4>
                <div id="relatorio-apuracao"></div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES GERAIS E HORÁRIOS DA ELEIÇÃO
        const DISCORD_CLIENT_ID = "1540492488534523974";
        const MULTIPLICADOR_VOTOS = 5;

        const HORARIOS_ELEICAO = {
            inicioVotacao:  "2026-10-01T18:41:00",
            fimVotacao:     "2026-10-01T18:43:00",
            inicioApuracao: "2026-10-01T18:45:00",
            fimApuracao:    "2026-10-01T18:47:00"
        };

        const etapas = [
            {
                cargo: "GOVERNADOR",
                digitos: 2,
                candidatos: {
                    "22": { 
                        nome: "ALEX SANTANA", 
                        partido: "PARTIDO LIBERAL", 
                        foto: "https://cdn.discordapp.com/attachments/1443052039797211156/1555331370728030340/file_00000000427c820ea5a5763fe6ea7b44.png?backend=b2&ex=6ac022b7&is=6abed137&hm=c1abdd5e93b1cfea01c88065da0d0e4e559eca854dc6c03d3dde3bfbff722166&" 
                    }
                }
            },
            {
                cargo: "PRESIDENTE",
                digitos: 2,
                candidatos: {
                    "14": { 
                        nome: "NICO GONÇALVES", 
                        partido: "MISSÃO", 
                        foto: "https://cdn.discordapp.com/attachments/1553953978570637412/1555333104925671494/image.png?backend=b2&ex=6ac02454&is=6abed2d4&hm=4493ef977079e11cfb312a3111ca7fa1e8803aa79a1dfa1670fc6e87c924af98&" 
                    },
                    "22": { 
                        nome: "AGROTECO", 
                        partido: "PL", 
                        foto: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80" 
                    }
                }
            }
        ];

        // Som do fim
        const somFim = new Audio("https://github.com/gamervermelho/site-urna/blob/main/urna.m4a?raw=true");

        let etapaAtual = 0;
        let numeroDigitado = "";
        let votoEmBranco = false;
        let votosRegistrados = [];

        function iniciarEtapa() {
            let etapa = etapas[etapaAtual];
            numeroDigitado = "";
            votoEmBranco = false;

            document.getElementById("cargo-nome").innerText = etapa.cargo;
            document.getElementById("dados-candidato").innerHTML = "";
            document.getElementById("foto-candidato").style.display = "none";

            let caixasHTML = "";
            for (let i = 0; i < etapa.digitos; i++) {
                caixasHTML += `<div class="digito-box ${i === 0 ? 'pisca' : ''}" id="digito-${i}"></div>`;
            }
            document.getElementById("caixas-digitos").innerHTML = caixasHTML;
        }

        function digitar(num) {
            let etapa = etapas[etapaAtual];
            if (numeroDigitado.length < etapa.digitos && !votoEmBranco) {
                numeroDigitado += num;
                let boxIndex = numeroDigitado.length - 1;
                let boxAtual = document.getElementById(`digito-${boxIndex}`);
                boxAtual.innerText = num;
                boxAtual.classList.remove('pisca');

                if (boxIndex + 1 < etapa.digitos) {
                    document.getElementById(`digito-${boxIndex + 1}`).classList.add('pisca');
                }

                if (numeroDigitado.length === etapa.digitos) {
                    atualizarCandidato();
                }
            }
        }

        function atualizarCandidato() {
            let etapa = etapas[etapaAtual];
            let candidato = etapa.candidatos[numeroDigitado];
            let dadosContainer = document.getElementById("dados-candidato");
            let fotoContainer = document.getElementById("foto-candidato");

            if (candidato) {
                dadosContainer.innerHTML = `
                    <strong>Nome:</strong> ${candidato.nome}<br>
                    <strong>Partido:</strong> ${candidato.partido}
                `;
                fotoContainer.src = candidato.foto;
                fotoContainer.style.display = "block";
            } else {
                dadosContainer.innerHTML = `<div style="font-size:20px; font-weight:bold; margin-top:10px;">VOTO NULO</div>`;
            }
        }

        function votarBranco() {
            if (numeroDigitado === "") {
                votoEmBranco = true;
                document.getElementById("caixas-digitos").innerHTML = "";
                document.getElementById("dados-candidato").innerHTML = `<div style="font-size:20px; font-weight:bold; margin-top:10px;">VOTO EM BRANCO</div>`;
            }
        }

        function corrige() {
            iniciarEtapa();
        }

        function confirma() {
            let etapa = etapas[etapaAtual];
            let votoConfirmado = false;

            if (votoEmBranco) {
                votosRegistrados.push({ cargo: etapa.cargo, voto: "BRANCO" });
                votoConfirmado = true;
            } else if (numeroDigitado.length === etapa.digitos) {
                votosRegistrados.push({ cargo: etapa.cargo, voto: numeroDigitado });
                votoConfirmado = true;
            }

            if (votoConfirmado) {
                etapaAtual++;
                if (etapaAtual < etapas.length) {
                    iniciarEtapa();
                } else {
                    finalizarVotacao();
                }
            }
        }

        function obterDataHoraBrasilia() {
            const data = new Date();
            const dias = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
            const diaSemana = dias[data.getDay()];
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const ano = data.getFullYear();
            const horas = String(data.getHours()).padStart(2, '0');
            const minutos = String(data.getMinutes()).padStart(2, '0');
            const segundos = String(data.getSeconds()).padStart(2, '0');

            return `${diaSemana} ${dia}/${mes}/${ano} ${horas}:${minutos}:${segundos}`;
        }

        function finalizarVotacao() {
            document.getElementById("tela-votacao").style.display = "none";
            document.getElementById("tela-fim").style.display = "flex";
            document.getElementById("fim-data-hora").innerText = obterDataHoraBrasilia();

            somFim.play().catch(() => {});

            setTimeout(() => {
                etapaAtual = 0;
                document.getElementById("tela-fim").style.display = "none";
                document.getElementById("tela-votacao").style.display = "flex";
                iniciarEtapa();
            }, 4000);
        }

        // Funções do Painel Admin
        function abrirAdmin() {
            document.getElementById("modal-admin").style.display = "flex";
        }

        function fecharAdmin() {
            document.getElementById("modal-admin").style.display = "none";
            document.getElementById("admin-conteudo").style.display = "none";
            document.getElementById("senha-admin").value = "";
        }

        function autenticarAdmin() {
            const senha = document.getElementById("senha-admin").value;
            if (senha === "0701") {
                document.getElementById("admin-conteudo").style.display = "block";
                gerarApuracao();
            } else {
                alert("Senha incorreta!");
            }
        }

        function gerarApuracao() {
            let html = "";
            etapas.forEach(etapa => {
                html += `<strong>${etapa.cargo}</strong><br>`;
                let contagem = {};

                votosRegistrados.filter(v => v.cargo === etapa.cargo).forEach(v => {
                    contagem[v.voto] = (contagem[v.voto] || 0) + (1 * MULTIPLICADOR_VOTOS);
                });

                for (let num in etapa.candidatos) {
                    let cand = etapa.candidatos[num];
                    let total = contagem[num] || 0;
                    html += `${cand.nome} (${cand.partido}): ${total} votos<br>`;
                }
                html += `Brancos: ${contagem["BRANCO"] || 0}<br><hr><br>`;
            });
            document.getElementById("relatorio-apuracao").innerHTML = html || "Nenhum voto registrado ainda.";
        }

        // Inicializar urna ao carregar
        iniciarEtapa();
    </script>
</body>
</html>
